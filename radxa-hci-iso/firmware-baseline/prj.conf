# radxa-hci-iso, bien the "baseline": NGUYEN BAN samples/bluetooth/hci_uart cua Zephyr v4.4.2 (prj.conf + cau hinh
# board nrf52840dongle), KHONG co ISO, chi doi ten USB de udev/systemd tren Radxa nhan dongle.
# Muc dich: doi chung. Ghep doi duoc tai nghe Samsung voi ban nay ma ban "iso"/"lean" thi khong -> loi do cau hinh ISO;
# ban nay cung khong ghep duoc -> loi tuong thich link layer Zephyr <-> tai nghe (khong phu thuoc cau hinh).

CONFIG_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y
CONFIG_BT_MAX_CONN=16
# Them DUY NHAT so voi nguyen ban: tai nghe Samsung chi quang ba extended advertising (kenh phu 2M); thieu dong nay
# controller khong thay va khong noi duoc tai nghe.
CONFIG_BT_EXT_ADV=y

CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Radxa Q6A"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Radxa HCI ISO nRF52840"
