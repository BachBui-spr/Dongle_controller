# radxa-hci-iso, bien the "lean": cau hinh LE Audio CIS central CHINH THUC cua Zephyr
# (samples/bluetooth/hci_ipc/nrf5340_cpunet_iso_central-bt_ll_sw_split.conf) chuyen sang nRF52840 Dongle, H4 qua
# USB CDC-ACM (nhu samples/bluetooth/hci_uart). Bo moi tuy chon cua overlay-all-bt_ll_sw_split.conf (ban "iso"):
# Coded PHY, +8 dBm, dieu khien cong suat, BIS, periodic advertising, LOW_LAT_ULL, EVENT_OVERHEAD_RESERVE_MAX...
# Muc dich: thu ghep doi + phat CIS toi tai nghe Samsung (ban "iso" mat ket noi 0x3E/0x08 ngay khi mo, TEST_REPORT F56).

# ---------------------------------------------------------------- He thong, cong USB CDC-ACM (nhu hci_uart)
CONFIG_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
# Cung ten USB voi ban "iso": udev/systemd tren Radxa nhan dongle khong can sua
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Radxa Q6A"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Radxa HCI ISO nRF52840"

# ---------------------------------------------------------------- HCI raw qua H4
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y
CONFIG_BT_MAX_CONN=4

CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255

# ---------------------------------------------------------------- Vai tro (nhu cau hinh chinh thuc, giu ca ngoai vi
# de chay duoc hci-iso-probe.sh --gatt)
CONFIG_BT_OBSERVER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV=n
CONFIG_BT_PER_ADV_SYNC=n
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y

# ---------------------------------------------------------------- ISO: chi CIS central (tai nghe)
CONFIG_BT_ISO_BROADCASTER=n
CONFIG_BT_ISO_SYNC_RECEIVER=n
CONFIG_BT_ISO_CENTRAL=y
CONFIG_BT_ISO_PERIPHERAL=n
CONFIG_BT_ISO_MAX_CHAN=2
CONFIG_BT_ISO_TX_BUF_COUNT=6
CONFIG_BT_ISO_RX_BUF_COUNT=1
# Kich thuoc goi ISO qua HCI giong ban "iso" (da chay 301 goi qua kernel)
CONFIG_BT_ISO_TX_MTU=310
CONFIG_BT_ISO_RX_MTU=310

# ---------------------------------------------------------------- Controller (nguyen cau hinh chinh thuc)
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_BT_HCI_VS_FATAL_ERROR=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=191

CONFIG_BT_CTLR_CENTRAL_ISO=y
CONFIG_BT_CTLR_PERIPHERAL_ISO=n
CONFIG_BT_CTLR_CONN_ISO_GROUPS=1
CONFIG_BT_CTLR_CONN_ISO_STREAMS=2
CONFIG_BT_CTLR_CONN_ISO_STREAMS_PER_GROUP=2
CONFIG_BT_CTLR_CONN_ISO_PDU_LEN_MAX=251
# Chinh sach LOW_LATENCY (nhu cau hinh chinh thuc) + main.c kep RTN <= 2 (clamp_cig_rtn): moi tai FT 1, NSE 3,
# 2 tai ~5,3 ms moi chu ky 10 ms, tre truyen ~15 ms. Da thu: LOW_LATENCY + RTN 13 -> 2 tai lam controller treo (F59);
# RELIABILITY -> FT 10, tre 93,5 ms, CIS chay nhung tai nghe khong phat ra tieng (F60).
CONFIG_BT_CTLR_CONN_ISO_LOW_LATENCY_POLICY=y
# (LE Read ISO Link Quality 0x2075 khong co: controller Nordic cua Zephyr v4.4.2 khong chon
#  BT_CTLR_READ_ISO_LINK_QUALITY_SUPPORT)

CONFIG_BT_CTLR_ISOAL_SOURCES=2
CONFIG_BT_CTLR_ISO_TX_BUFFERS=6
CONFIG_BT_CTLR_ISO_TX_BUFFER_SIZE=255
CONFIG_BT_CTLR_ISO_TX_SDU_LEN_MAX=247
CONFIG_BT_CTLR_ISOAL_SINKS=2
CONFIG_BT_CTLR_ISO_RX_BUFFERS=4

CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CENTRAL_RESERVE_MAX=n
CONFIG_BT_CTLR_SLOT_RESERVATION_UPDATE=n
CONFIG_BT_CTLR_SCAN_UNRESERVED=y
CONFIG_BT_TICKER_NEXT_SLOT_GET_MATCH=y
CONFIG_BT_TICKER_EXT=y
CONFIG_BT_TICKER_EXT_SLOT_WINDOW_YIELD=y
